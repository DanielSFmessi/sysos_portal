<VirtualHost *:80>
    ServerName sysos.local
    DocumentRoot /var/www/sysos_portal

    <Directory /var/www/sysos_portal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sysos_error.log
    CustomLog ${APACHE_LOG_DIR}/sysos_access.log combined
</VirtualHost>